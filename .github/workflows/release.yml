# Wydanie: tag v* → binarki Native AOT linux-x64 i linux-arm64, zbudowane w kontenerze AlmaLinux 9
# (scripts/release-build.sh, glibc 2.34), sprawdzone w czystych kontenerach dystrybucji (scripts/test-distros.sh),
# oraz osx-arm64 i osx-x64 zbudowane na runnerach macOS i sprawdzone tamże — wszystkie dołączone do SZKICU wydania na GitHubie z atestacją pochodzenia — publikuje człowiek po przejrzeniu.
# Ręczne uruchomienie (workflow_dispatch) tylko buduje i testuje, bez wydania.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Szkic wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "ksef $GITHUB_REF_NAME"

  build:
    needs: draft
    # Bez taga (workflow_dispatch) szkicu nie ma — budujemy mimo to.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            # Arch Linux nie ma oficjalnego obrazu arm64 — tylko na x64.
            images: ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 almalinux:9 almalinux:10 fedora:latest archlinux:latest opensuse/tumbleweed
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            images: ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13 almalinux:9 almalinux:10 fedora:latest opensuse/tumbleweed
          - runner: macos-15
            os: osx
            arch: arm64
          - runner: macos-15-intel
            os: osx
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      # Atestacja pochodzenia binarek (Sigstore): podpis tokenem OIDC tego przebiegu.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Bez zagnieżdżonego ksef-pdf-generator w bibliotece MF; pełna historia dla git describe.
          submodules: true
          fetch-depth: 0
      # SDK w kontenerze wydania = to SDK (release-build.sh bierze `dotnet --version`), jak w CI.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: "Budowanie (Linux — kontener AlmaLinux 9, macOS — na runnerze)"
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            scripts/release-build.sh "${GITHUB_REF_NAME#v}"
          else
            scripts/release-build.sh
          fi
      - name: Test w czystych kontenerach
        if: matrix.os == 'linux'
        run: |
          tar -C dist/release -xzf dist/release/ksef-*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          # shellcheck disable=SC2086 # lista obrazów rozdzielona spacjami
          scripts/test-distros.sh dist/release/ksef-*-${{ matrix.os }}-${{ matrix.arch }}/ksef ${{ matrix.images }} | tee dist/distros.md
          cat dist/distros.md >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "BŁĄD" dist/distros.md
      # Na macOS nie ma kontenerów: testy CLI na rozpakowanej binarce z archiwum, na czystym runnerze.
      - name: Test binarki z archiwum (macOS)
        if: matrix.os == 'osx'
        run: |
          tar -C dist/release -xzf dist/release/ksef-*-osx-${{ matrix.arch }}.tar.gz
          bin=$(ls "$PWD"/dist/release/ksef-*-osx-${{ matrix.arch }}/ksef)
          "$bin" --version
          KSEF_BIN="$bin" dotnet test --project tests/KsefCli.Tests -c Release
      # SBOM (CycloneDX): podpisana lista składników binarki — przy nowej luce w zależności od razu widać,
      # czy dotyczy ksef. Także bez taga (workflow_dispatch), żeby sprawdzić generowanie.
      - name: SBOM
        id: sbom
        run: |
          dotnet tool restore
          version=$(git describe --tags --always)
          archive=$(ls dist/release/ksef-*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz)
          scripts/sbom.sh "${version#v}" ${{ matrix.os }}-${{ matrix.arch }} "$archive.cdx.json"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      # Atestacja pochodzenia (SLSA build provenance, Sigstore): każdy może sprawdzić, że archiwum zbudował
      # ten workflow z tego repo — `gh attestation verify` albo niezależnie `cosign` (docs/INSTALL.md).
      # Plik podpisu (.sigstore.json) idzie do wydania obok archiwum, żeby sprawdzenie nie wymagało GitHuba.
      - name: Atestacja pochodzenia
        id: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/release/*.tar.gz
      - name: Podpis SBOM
        id: attest-sbom
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.sbom.outputs.archive }}
          sbom-path: ${{ steps.sbom.outputs.archive }}.cdx.json
      - name: Pliki podpisów do wydania
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          archive=$(ls dist/release/ksef-*-${{ matrix.os }}-${{ matrix.arch }}.tar.gz)
          cp "$BUNDLE" "$archive.sigstore.json"
          cp "$SBOM_BUNDLE" "$archive.cdx.json.sigstore.json"
      - name: Dołączenie do szkicu wydania
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/release/*.tar.gz dist/release/*.tar.gz.sha256 dist/release/*.tar.gz.sigstore.json \
          dist/release/*.tar.gz.cdx.json dist/release/*.tar.gz.cdx.json.sigstore.json
