# To samo co `make check` (lint + build z analizatorami + testy bez sieci) oraz osobno `make aot`
# z bramką ostrzeżeń AOT (src/KsefCli/aot-warnings.txt). Testy E2E (KSEF_E2E) zostają lokalne.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Pełna historia dla gitleaks; submodułu MF lint nie potrzebuje.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv nie ma ruchomego tagu v10
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: gitleaks (cała historia)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks git --redact --no-banner && rm gitleaks
      # Hook gitleaks z pre-commit skanuje tylko zmiany w indeksie — w CI zastępuje go krok wyżej.
      - run: make lint
        env:
          SKIP: gitleaks

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Bez zagnieżdżonego ksef-pdf-generator w bibliotece MF.
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # `ksef show` i jego testy ładują libxslt w czasie działania.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxslt1.1
      - run: make build
      - run: make test

  aot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-aot-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - run: make aot
      - run: ./dist/aot/ksef --help
